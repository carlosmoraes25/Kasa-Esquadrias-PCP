<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasa da Esquadria — Estoque &amp; Obras</title>
<style>
  :root{
    --graphite:#1b1e22;
    --graphite-2:#25292e;
    --steel:#3d4451;
    --line:#e4e2dc;
    --paper:#f6f4ef;
    --paper-2:#ffffff;
    --ink:#20221f;
    --ink-soft:#6b6f66;
    --alu:#9aa0a6;
    --amber:#c8792a;
    --amber-soft:#f4e3cc;
    --green:#3f7d52;
    --green-soft:#dfeee2;
    --blue:#3a6d8c;
    --radius:3px;
    --mono: "SF Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    background:var(--paper);
    color:var(--ink);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--amber-soft);}
  a{color:inherit;}
  #root{display:flex; min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:220px;
    flex:0 0 220px;
    background:var(--graphite);
    color:#d8dadd;
    display:flex;
    flex-direction:column;
    padding:20px 0;
  }
  .brand{
    padding:0 20px 18px 20px;
    border-bottom:1px solid #33383f;
    margin-bottom:10px;
  }
  .brand-mark{
    font-family: var(--mono);
    font-size:11px;
    letter-spacing:.06em;
    color:var(--alu);
    margin-bottom:4px;
  }
  .brand-name{
    font-size:16px;
    font-weight:600;
    color:#fff;
    line-height:1.25;
  }
  .nav{display:flex; flex-direction:column; padding:8px 10px; gap:2px;}
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:9px 12px;
    border-radius:var(--radius);
    cursor:pointer;
    color:#c2c5ca;
    font-size:13.5px;
    font-weight:500;
    border-left:2px solid transparent;
    transition: background .12s ease;
  }
  .nav-item:hover{background:#2a2f36; color:#fff;}
  .nav-item.active{background:#2b3038; color:#fff; border-left:2px solid var(--amber);}
  .nav-icon{width:16px; text-align:center; font-size:14px; opacity:.85;}
  .nav-count{
    margin-left:auto;
    font-family:var(--mono);
    font-size:10.5px;
    background:#33383f;
    color:#b8bcc2;
    padding:1px 6px;
    border-radius:8px;
  }
  .nav-count.warn{background:var(--amber); color:#241503;}
  .sidebar-foot{
    margin-top:auto;
    padding:14px 20px 0 20px;
    border-top:1px solid #33383f;
    font-size:11.5px;
    color:#7d828a;
    line-height:1.5;
  }

  /* Main */
  .main{flex:1; display:flex; flex-direction:column; min-width:0;}
  .topbar{
    height:56px; flex:0 0 56px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 26px;
    border-bottom:1px solid var(--line);
    background:var(--paper-2);
  }
  .topbar h1{font-size:16px; font-weight:600; margin:0;}
  .topbar .sub{font-size:12px; color:var(--ink-soft); margin-top:1px;}
  .content{flex:1; padding:24px 26px 60px 26px; overflow-y:auto;}

  .save-pill{
    font-family:var(--mono); font-size:11px; color:var(--ink-soft);
    display:flex; align-items:center; gap:6px;
  }
  .dot{width:6px; height:6px; border-radius:50%; background:var(--green); flex:0 0 6px;}
  .dot.saving{background:var(--amber); animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  /* Cards */
  .grid-cards{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:26px;}
  .card{
    background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px;
  }
  .card .k{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:8px;}
  .card .v{font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1;}
  .card .v.amber{color:var(--amber);}
  .card .foot{font-size:11.5px; color:var(--ink-soft); margin-top:6px;}

  section{margin-bottom:30px;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px;}
  .section-head h2{font-size:14px; font-weight:600; margin:0;}
  .section-head .meta{font-size:12px; color:var(--ink-soft);}

  /* Tables */
  table{width:100%; border-collapse:collapse; background:var(--paper-2); border:1px solid var(--line);}
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em;
    color:var(--ink-soft); font-weight:600; padding:9px 12px; border-bottom:1px solid var(--line);
    background:#fbfaf7; position:sticky; top:0;
  }
  tbody td{padding:9px 12px; border-bottom:1px solid #eeece6; font-size:13px; vertical-align:middle;}
  tbody tr:hover{background:#faf8f3;}
  tbody tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right; font-variant-numeric:tabular-nums; font-family:var(--mono);}
  .table-wrap{overflow:auto; border-radius:var(--radius);}
  .table-scroll{max-height:520px; overflow-y:auto;}

  .badge{display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600;}
  .badge.ok{background:var(--green-soft); color:var(--green);}
  .badge.warn{background:var(--amber-soft); color:var(--amber);}
  .badge.entrada{background:var(--green-soft); color:var(--green);}
  .badge.saida{background:#f3dede; color:#a13c3c;}
  .badge.neutral{background:#eceae3; color:var(--ink-soft);}

  /* Controls */
  .toolbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px;}
  input[type=text], input[type=number], input[type=date], select, textarea{
    font-family:inherit; font-size:13px; padding:8px 10px;
    border:1px solid var(--line); border-radius:var(--radius); background:#fff; color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--steel);}
  .search-input{width:260px;}
  button{
    font-family:inherit; font-size:13px; font-weight:600; cursor:pointer;
    padding:8px 14px; border-radius:var(--radius); border:1px solid var(--graphite);
    background:var(--graphite); color:#fff; transition:opacity .12s;
  }
  button:hover{opacity:.88;}
  button.secondary{background:#fff; color:var(--ink); border:1px solid var(--line);}
  button.danger{background:#fff; color:#a13c3c; border:1px solid #e3c3c3;}
  button.small{padding:5px 10px; font-size:12px;}
  button:disabled{opacity:.4; cursor:not-allowed;}

  .pill-toggle{display:flex; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  .pill-toggle button{border:none; border-radius:0; background:#fff; color:var(--ink-soft);}
  .pill-toggle button.active{background:var(--graphite); color:#fff;}

  /* Form */
  .form-card{background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius); padding:22px; max-width:640px;}
  .form-row{display:flex; flex-direction:column; gap:5px; margin-bottom:14px;}
  .form-row label{font-size:12px; font-weight:600; color:var(--ink-soft);}
  .form-row-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .hint{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .form-actions{display:flex; gap:10px; margin-top:6px;}

  .autocomplete{position:relative;}
  .ac-list{
    position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid var(--line);
    max-height:220px; overflow-y:auto; z-index:20; border-radius:0 0 var(--radius) var(--radius);
    box-shadow:0 8px 18px rgba(0,0,0,.08);
  }
  .ac-item{padding:8px 10px; cursor:pointer; font-size:13px; border-bottom:1px solid #f1f0eb;}
  .ac-item:hover, .ac-item.hi{background:var(--amber-soft);}
  .ac-item .meta{font-size:11px; color:var(--ink-soft);}

  .modal-bg{
    position:fixed; inset:0; background:rgba(20,20,18,.45); display:flex; align-items:center; justify-content:center; z-index:100;
  }
  .modal{background:#fff; border-radius:var(--radius); padding:24px; width:480px; max-width:92vw; max-height:88vh; overflow-y:auto;}
  .modal h3{margin:0 0 16px 0; font-size:15px;}

  .empty{padding:40px 20px; text-align:center; color:var(--ink-soft); font-size:13px;}
  .empty b{color:var(--ink); display:block; margin-bottom:4px; font-size:14px;}

  .obra-card{
    background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; cursor:pointer; transition:border-color .12s;
  }
  .obra-card:hover{border-color:var(--steel);}
  .obra-card .nm{font-weight:600; font-size:13.5px; margin-bottom:6px;}
  .obra-card .cost{font-family:var(--mono); font-size:20px; font-weight:600;}
  .obra-card .items{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}
  .obras-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}

  .breadcrumb{font-size:12px; color:var(--ink-soft); margin-bottom:10px; cursor:pointer;}
  .breadcrumb:hover{color:var(--ink);}

  .type-toggle{display:flex; gap:0; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; width:fit-content;}
  .type-toggle button{border:none; border-radius:0; padding:9px 22px;}
  .type-toggle button.entrada.active{background:var(--green); color:#fff;}
  .type-toggle button.saida.active{background:#a13c3c; color:#fff;}
  .type-toggle button:not(.active){background:#fff; color:var(--ink-soft);}

  @media (max-width: 900px){
    .grid-cards{grid-template-columns:repeat(2,1fr);}
    .obras-grid{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>
<div id="root"></div>

/* ---- painel de log visível na tela (sem precisar abrir DevTools) ---- */
(function(){
  const box = document.createElement('div');
  box.id = 'debug-log-box';
  box.style.cssText = 'position:fixed;bottom:0;left:0;right:0;max-height:40vh;overflow-y:auto;background:#1b1e22;color:#e4e2dc;font-family:monospace;font-size:11px;padding:8px;z-index:99999;white-space:pre-wrap;border-top:2px solid #c8792a;display:block;';
  const toggle = document.createElement('button');
  toggle.textContent = 'Log (0)';
  toggle.style.cssText = 'position:fixed;bottom:8px;right:8px;z-index:100000;background:#1b1e22;color:#fff;border:1px solid #555;border-radius:4px;padding:6px 10px;font-family:monospace;font-size:11px;cursor:pointer;';
  let count = 0;
  toggle.onclick = ()=>{ box.style.display = box.style.display==='none' ? 'block' : 'none'; };
  function addLine(tipo, args){
    count++;
    toggle.textContent = 'Log (' + count + ')';
    if(tipo==='error') toggle.style.background = '#a13c3c';
    const line = document.createElement('div');
    line.style.marginBottom = '4px';
    line.style.color = tipo==='error' ? '#ff8a8a' : (tipo==='warn' ? '#f4c542' : '#e4e2dc');
    line.textContent = '[' + tipo.toUpperCase() + '] ' + args.map(a=>{
      try{ return typeof a==='object' ? JSON.stringify(a) : String(a); }catch(e){ return String(a); }
    }).join(' ');
    box.appendChild(line);
  }
  ['log','warn','error'].forEach(tipo=>{
    const original = console[tipo];
    console[tipo] = function(...args){
      addLine(tipo, args);
      original.apply(console, args);
    };
  });
  window.addEventListener('DOMContentLoaded', ()=>{
    if(!document.getElementById('debug-log-box')){ document.body.appendChild(box); document.body.appendChild(toggle); }
  });
  if(document.body && !document.getElementById('debug-log-box')){ document.body.appendChild(box); document.body.appendChild(toggle); }
  window.addEventListener('error', e=> addLine('error', [
    (e.message||'(sem mensagem)') + (e.filename?(' — '+e.filename+':'+e.lineno+':'+e.colno):''),
    e.error && e.error.stack ? ('STACK: '+e.error.stack.slice(0,300)) : '(sem stack disponível)'
  ]));
  window.addEventListener('unhandledrejection', e=> addLine('error', ['Erro assíncrono: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)]));
  console.log('Painel de log iniciado.');
})();

function todayISO(){

function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtMoney(v){
  if(v===null||v===undefined||isNaN(v)) return '—';
  return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}
function fmtNum(v){
  if(v===null||v===undefined||isNaN(v)) return '—';

}
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return iso;
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

async function fetchAll(table, mapper){
  let all = [];
  let from = 0;
  const PAGE = 1000;
  while(true){
    const { data, error } = await sbClient.from(table).select('*').range(from, from+PAGE-1);
    if(error){ console.error('Erro ao carregar', table, error); showToast('Erro ao carregar '+table+': '+error.message, 'error'); break; }
    all = all.concat(data.map(mapper));
    if(data.length < PAGE) break;
    from += PAGE;
  }
  return all;
}

async function loadAll(){
  const [p,o,f,m,pe] = await Promise.all([
    fetchAll('produtos', rowToProduto),
    fetchAll('obras', rowToObra),

    fetchAll('movimentacoes', rowToMov),
    fetchAll('pedidos', rowToPed)
  ]);
  state.produtos = p; state.obras = o; state.fornecedores = f; state.movimentacoes = m; state.pedidos = pe;
  state.precisaImportar = (p.length===0 && o.length===0);
  state.loaded = true;
  render();
}

const ROW_MAPPERS = {
  produtos: produtoToRow, obras: obraToRow, fornecedores: fornecedorToRow,
  movimentacoes: movToRow, pedidos: pedToRow
};

async function salvarUm(table, obj){
  state.saving = true; updateSaveIndicator();
  const row = ROW_MAPPERS[table](obj);
  const { error } = await sbClient.from(table).upsert([row]);
  if(error){ console.error(error); showToast('Erro ao salvar: '+error.message, 'error'); }
  state.saving = false; updateSaveIndicator();
}
async function excluirUm(table, id){
  state.saving = true; updateSaveIndicator();
  const { error } = await sbClient.from(table).delete().eq('id', id);
  if(error){ console.error(error); showToast('Erro ao excluir: '+error.message, 'error'); }
  state.saving = false; updateSaveIndicator();
}
// tracker de linhas de movimentação pendentes de salvar (evita reenviar a tabela inteira)
state._dirtyMovs = [];
function marcarMovDirty(mov){ state._dirtyMovs.push(mov); }

async function persist(which, objForSingleTables){
  state.saving = true; updateSaveIndicator();
  try{
    const jobs = [];
    ['produtos','obras','fornecedores','pedidos'].forEach(t=>{
      if(which.includes(t) && objForSingleTables && objForSingleTables[t]){
        jobs.push(sbClient.from(t).upsert([ROW_MAPPERS[t](objForSingleTables[t])]));
      }
    });
    if(which.includes('movimentacoes') && state._dirtyMovs.length){
      const rows = state._dirtyMovs.map(movToRow);
      jobs.push(sbClient.from('movimentacoes').upsert(rows));
      state._dirtyMovs = [];
    }
    const results = await Promise.all(jobs);
    results.forEach(r=>{ if(r && r.error) { console.error(r.error); showToast('Erro ao salvar: '+r.error.message, 'error'); } });
  }catch(e){
    console.error('Erro ao salvar', e);
    showToast('Erro ao salvar.', 'error');
  }
  state.saving = false; updateSaveIndicator();
}

function normalizeNome(s){
  return (s||'')
    .toUpperCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[0-9]/g,' ')
    .replace(/OBRA\b/g,' ')
    .replace(/[^A-Z ]/g,' ')
    .split(' ')
    .filter(w=>w.length>2)
    .filter(w=>!['ETAPA','PREDIO'].includes(w));
}
function sugerirVinculos(){
  state.pedidos.forEach(ped=>{
    const wordsPed = new Set(normalizeNome(ped.ped));
    if(wordsPed.size===0) return;
    const candidatos = state.obras.filter(o=>{
      const wordsObra = normalizeNome(o.n);
      if(wordsObra.length===0) return false;
      const inter = wordsObra.filter(w=>wordsPed.has(w)).length;
      return inter===wordsObra.length; // todas as palavras da obra aparecem no pedido
    });
    if(candidatos.length===1){ ped.obraId = candidatos[0].id; ped.autoVinculo = true; }
  });
}

function isReposicao(p){

  return p.q < min;
}
function valorEstoqueTotal(){
  return state.produtos.reduce((sum,p)=>{
    if(p.q>0 && p.p) return sum + p.q*p.p;
    return sum;
  },0);
}

function precoNaMovimentacao(m){
  // preço travado no momento do lançamento; se não houver (registro muito antigo sem preço
  // cadastrado na época), usa o preço atual do produto como última alternativa.
  if(m.preco !== null && m.preco !== undefined) return m.preco;
  const p = produtoById(m.produtoId);
  return (p && p.p) || 0;
}
function custoObra(obraId){
  return movAtivas()
    .filter(m=> m.obraId===obraId && (m.tipo==='Saída' || m.tipo==='Devolução'))
    .reduce((sum,m)=>{
      const preco = precoNaMovimentacao(m);
      const sinal = m.tipo==='Devolução' ? -1 : 1;
      return sum + sinal*preco*m.qtd;
    },0);
}
function custoObraPorVertente(obraId){
  const totais = {aluminio:0, vidro:0, acessorio:0};
  movAtivas()
    .filter(m=> m.obraId===obraId && (m.tipo==='Saída' || m.tipo==='Devolução'))
    .forEach(m=>{
      const preco = precoNaMovimentacao(m);
      const sinal = m.tipo==='Devolução' ? -1 : 1;
      const v = m.vertente || 'acessorio';
      totais[v] = (totais[v]||0) + sinal*preco*m.qtd;
    });
  return totais;
}
function itensObra(obraId){
  return movAtivas().filter(m=> m.obraId===obraId && (m.tipo==='Saída' || m.tipo==='Devolução'));
}

function valorFaturadoFat(x){
  if(!x || !x.valorVenda) return 0;
  return etapasFat(x).filter(e=>e.faturado).reduce((s,e)=> s+((e.percentual||0)/100)*x.valorVenda, 0);

function saldoAReceberFat(x){
  if(!x || !x.valorVenda) return null;

      <div class="form-actions" style="margin-top:12px;">
        ${souAdmin() ? '<button id="etapa-add" class="secondary small">+ Adicionar etapa</button>' : ''}
      </div>
    </div>`;
}
function faltaObraPorVertente(ped){
  return {
    aluminio: (ped.casis||0) - aluminioReal(ped),
    vidro: (ped.cvsis||0) - vidroReal(ped),
    acessorio: (ped.caesis||0) - acessorioReal(ped)
  };
}
function percProducaoFaturada(ped){
  if(!ped) return null;
  return etapasFat(ped).filter(e=>e.tipo==='producao' && e.faturado).reduce((s,e)=>s+(e.percentual||0),0);
}
function percCustoConsumido(ped){
  const sistTotal = (ped.casis||0)+(ped.cvsis||0)+(ped.caesis||0);
  if(!sistTotal) return null;
  const realTotal = aluminioReal(ped)+vidroReal(ped)+acessorioReal(ped);
  return (realTotal/sistTotal)*100;
}
function nextId(arr){
  return arr.length ? Math.max(...arr.map(x=>x.id))+1 : 1;
}

/* ---------------- toast ---------------- */
function showToast(msg, kind){
  state.toast = {msg, kind: kind||'ok'};
  render();
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>{ state.toast=null; render(); }, 2600);
}

/* ================= RENDER ================= */
function render(){
  if(state.authView === 'login'){
    $root.innerHTML = renderLogin();
    attachAuthEvents();
    return;
  }
  if(!state.loaded){
    $root.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100vh;color:#6b6f66;font-size:13px;">Carregando dados…</div>`;
    return;
  }
  if(state.precisaImportar){
    $root.innerHTML = renderImportar();
    attachImportarEvents();
    return;
  }
  $root.innerHTML = `
    ${renderSidebar()}
    <div class="main">
      ${renderTopbar()}
      <div class="content" id="content">${renderView()}</div>
    </div>
    ${state.modal ? renderModal() : ''}
    ${state.toast ? `<div style="position:fixed;bottom:22px;right:22px;background:${state.toast.kind==='error'?'#a13c3c':'#1b1e22'};color:#fff;padding:12px 18px;border-radius:3px;font-size:13px;z-index:200;box-shadow:0 8px 20px rgba(0,0,0,.2);">${esc(state.toast.msg)}</div>` : ''}
  `;
  attachEvents();
}

function renderLogin(){
  return `
  <div style="display:flex;align-items:center;justify-content:center;width:100%;height:100vh;background:var(--paper);">
    <div style="background:var(--paper-2);border:1px solid var(--line);border-radius:3px;padding:32px;width:340px;">
      <div style="font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--alu);margin-bottom:4px;">KASA DA ESQUADRIA</div>
      <h2 style="margin:0 0 20px 0;font-size:17px;">Entrar no sistema</h2>
      <div class="form-row"><label>E-mail</label><input type="email" id="login-email" autocomplete="username"></div>
      <div class="form-row"><label>Senha</label><input type="password" id="login-senha" autocomplete="current-password"></div>
      ${state.authError ? `<div style="color:#a13c3c;font-size:12.5px;margin-bottom:10px;">${esc(state.authError)}</div>` : ''}
      <button id="login-btn" style="width:100%;margin-top:6px;" ${state.authLoading?'disabled':''}>${state.authLoading?'Entrando…':'Entrar'}</button>
    </div>
  </div>`;
}
function attachAuthEvents(){
  const btn = document.getElementById('login-btn');
  const senha = document.getElementById('login-senha');
  const doLogin = ()=>{
    const email = document.getElementById('login-email').value.trim();
    const pass = document.getElementById('login-senha').value;
    if(!email || !pass){ state.authError='Informe e-mail e senha.'; render(); return; }
    fazerLogin(email, pass);
  };
  if(btn) btn.addEventListener('click', doLogin);
  if(senha) senha.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

function renderImportar(){
  return `
  <div style="display:flex;align-items:center;justify-content:center;width:100%;height:100vh;background:var(--paper);">
    <div style="background:var(--paper-2);border:1px solid var(--line);border-radius:3px;padding:32px;width:460px;">
      <h2 style="margin:0 0 12px 0;font-size:17px;">Banco de dados vazio</h2>

function attachImportarEvents(){

}

function renderTopbar(){
  const titles = {

    movimentacao:['Registrar movimentação','Entrada ou saída de material'],

function renderView(){
  switch(state.view){
    case 'dashboard': return renderDashboard();
    case 'estoque': return renderEstoque();
    case 'movimentacao': return renderMovimentacao();
    case 'obras': return state.obraSelecionada ? renderObraDetail() : renderObras();
    case 'comparativo': return state.pedidoSelecionado ? renderPedidoDetail() : renderComparativo();
    case 'faturamento': return renderDashboard();
    case 'necessidade': return renderDashboard();
    case 'vinculos': return renderDashboard();
    case 'historico': return renderHistorico();
    case 'fornecedores': return renderFornecedores();
    default: return '';
  }

/* ---- DASHBOARD ---- */

    .map(o=>({obra:o, custo:custoObra(o.id)}))
    .filter(x=>x.custo>0)
    .sort((a,b)=>b.custo-a.custo)

function renderMovRow(m, showActions){
  const p = produtoById(m.produtoId);

  return `

    <td><span class="badge ${badgeClass}">${m.tipo}</span></td>
    <td>${esc(p ? p.n : '(produto removido)')}${m.naoAfetaEstoque ? ' <span class="badge neutral" style="font-size:9.5px;" title="Não descontou do saldo do estoque">histórico</span>' : ''}</td>
    <td class="num">${fmtQtd(m.qtd, p ? p.u : 'un')}</td>
    <td>${esc(destino)}</td>
    <td>${esc(m.responsavel||'—')}</td>

}

/* ---- COMPARATIVO SISTEMA x REAL ---- */
function sobraKg(ped){
  if(ped.pbruto===null || ped.pbruto===undefined || ped.pliq===null || ped.pliq===undefined) return null;
  return round3(ped.pbruto - ped.pliq);
}
function creditoSucata(ped){
  const sobra = sobraKg(ped);
  if(sobra===null || !ped.precoSucata) return 0;
  return sobra * ped.precoSucata;
}
function temMovimentacaoVertente(obraId, vertente){
  return movAtivas().some(m=> m.obraId===obraId && (m.tipo==='Saída'||m.tipo==='Devolução') && (m.vertente||'acessorio')===vertente);
}
function aluminioReal(ped){
  // só usa o valor calculado das movimentações se já existir pelo menos um lançamento
  // dessa vertente pra essa obra; senão mantém o valor importado da planilha, pra não
  // mostrar R$ 0,00 num custo que simplesmente ainda não foi lançado no estoque.
  const base = (ped.obraId && temMovimentacaoVertente(ped.obraId,'aluminio'))
    ? custoObraPorVertente(ped.obraId).aluminio
    : (ped.careal || 0);
  // a sucata (sobra de alumínio bruto menos líquido) entra como crédito, reduzindo
  // o custo real de alumínio gasto na obra.
  return base - creditoSucata(ped);
}
function vidroReal(ped){
  if(ped.obraId && temMovimentacaoVertente(ped.obraId,'vidro')) return custoObraPorVertente(ped.obraId).vidro;
  return ped.cvreal || 0;
}
function acessorioReal(ped){
  if(ped.obraId && temMovimentacaoVertente(ped.obraId,'acessorio')) return custoObraPorVertente(ped.obraId).acessorio;
  return ped.caereal || 0;
}
function cmvRealCalc(ped){
  return aluminioReal(ped) + vidroReal(ped) + acessorioReal(ped);
}
function deltaPct(sist, real){
  if(!sist) return null;
  return ((real - sist) / sist) * 100;
}
function badgeDeltaCusto(sist, real){
  // pra custo, o real "bom" é igual ou abaixo do sistema (previsto).
  // real acima do sistema = estourou o orçamento.
  const d = deltaPct(sist, real);
  if(d===null) return '<span class="badge neutral">—</span>';
  if(d<=0){
    return `<span class="badge ok">${d.toFixed(1)}%</span>`;
  }
  if(d<=10){
    return `<span class="badge warn">+${d.toFixed(1)}%</span>`;
  }
  return `<span class="badge warn" style="background:#f3dede;color:#a13c3c;">+${d.toFixed(1)}%</span>`;
}
function badgeDeltaPeso(sist, real){
  // pra peso, tanto faltar quanto sobrar material indica diferença em relação ao projeto.
  const d = deltaPct(sist, real);
  if(d===null) return '<span class="badge neutral">—</span>';
  const abs = Math.abs(d);
  const cls = abs<=5 ? 'ok' : 'warn';
  const color = abs>15 ? 'style="background:#f3dede;color:#a13c3c;"' : '';
  const sign = d>0 ? '+' : '';
  return `<span class="badge ${cls}" ${color}>${sign}${d.toFixed(1)}%</span>`;
}

function renderFaturamento(){
  const pedidosComDados = state.pedidos.filter(p=> p.valorVenda || etapasFat(p).length);
  const totalVendido = state.pedidos.reduce((s,p)=> s+(p.valorVenda||0), 0);
  const totalFaturado = state.pedidos.reduce((s,p)=> s+valorFaturadoFat(p), 0);
  const totalSaldo = totalVendido - totalFaturado;

  // meses disponíveis a partir das datas das etapas faturadas
  const mesesSet = new Set();
  state.pedidos.forEach(p=> etapasFat(p).forEach(e=>{
    if(e.faturado && e.data) mesesSet.add(e.data.slice(0,7));
  }));
  const meses = [...mesesSet].sort().reverse();
  const nomesMes = {'01':'Janeiro','02':'Fevereiro','03':'Março','04':'Abril','05':'Maio','06':'Junho','07':'Julho','08':'Agosto','09':'Setembro','10':'Outubro','11':'Novembro','12':'Dezembro'};
  function labelMes(m){ const [y,mm]=m.split('-'); return `${nomesMes[mm]||mm}/${y.slice(2)}`; }

  let linhasMes = [];
  if(state.fatMesFiltro){
    state.pedidos.forEach(p=>{
      etapasFat(p).forEach(e=>{
        if(e.faturado && e.data && e.data.slice(0,7)===state.fatMesFiltro){
          linhasMes.push({ ped:p, etapa:e, valor: p.valorVenda ? ((e.percentual||0)/100)*p.valorVenda : 0 });
        }
      });
    });
  }
  const producaoMes = linhasMes.filter(l=>l.etapa.tipo==='producao');

    <div class="grid-cards" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px;">

    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Pedido</th><th>Etapa</th><th>Tipo</th><th class="num">%</th><th class="num">Valor</th><th>Data</th></tr></thead>
      <tbody>
        ${linhasMes.length===0 ? `<tr><td colspan="6"><div class="empty">Nenhuma etapa faturada nesse mês.</div></td></tr>` : linhasMes.map(l=>`
        <tr data-pedido="${l.ped.id}" style="cursor:pointer;">
          <td>${esc(l.ped.ped)}</td>
          <td>${esc(l.etapa.nome)}</td>
          <td><span class="badge ${l.etapa.tipo==='producao'?'ok':(l.etapa.tipo==='instalacao'?'warn':'neutral')}">${l.etapa.tipo==='producao'?'Produção':(l.etapa.tipo==='instalacao'?'Instalação':'Outro')}</span></td>
          <td class="num">${fmtNum(l.etapa.percentual)}%</td>
          <td class="num">${fmtMoney(l.valor)}</td>
          <td>${l.etapa.data||'—'}</td>

      <tbody>
        ${listaGeral.length===0 ? `<tr><td colspan="5"><div class="empty">Nenhum pedido com valor de venda cadastrado ainda.</div></td></tr>` : listaGeral.map(p=>`
        <tr data-pedido="${p.id}" style="cursor:pointer;">
          <td><b>${esc(p.ped)}</b></td>

          <td class="num">${fmtNum(percFaturadoFat(p))}%</td>
          <td class="num">${fmtMoney(valorFaturadoFat(p))}</td>
          <td class="num">${p.valorVenda ? fmtMoney(saldoAReceberFat(p)) : '—'}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>
  </section>
  `;
}

function renderNecessidade(){
  const pedidosAndamento = state.pedidos.filter(p=>p.status==='Em andamento');

  let totalAlum=0, totalVidro=0, totalAcess=0;
  const linhas = pedidosAndamento.map(ped=>{
    const falta = faltaObraPorVertente(ped);
    totalAlum += falta.aluminio;
    totalVidro += falta.vidro;
    totalAcess += falta.acessorio;
    const percProd = percProducaoFaturada(ped);
    const percCusto = percCustoConsumido(ped);
    let alerta = null;
    if(percProd!==null && percCusto!==null){
      const diff = percProd - percCusto;
      if(Math.abs(diff)>20) alerta = diff;
    }
    return { ped, falta, totalFalta: falta.aluminio+falta.vidro+falta.acessorio, percProd, percCusto, alerta };
  }).sort((a,b)=> b.totalFalta - a.totalFalta);

  return `
  <div class="grid-cards" style="margin-bottom:18px;">
    <div class="card"><div class="k">Falta gastar — Alumínio</div><div class="v" style="font-size:20px;">${fmtMoney(totalAlum)}</div><div class="foot">pra terminar todas as obras em andamento</div></div>
    <div class="card"><div class="k">Falta gastar — Vidro</div><div class="v" style="font-size:20px;">${fmtMoney(totalVidro)}</div></div>
    <div class="card"><div class="k">Falta gastar — Acessório</div><div class="v" style="font-size:20px;">${fmtMoney(totalAcess)}</div></div>
  </div>
  <div class="hint" style="margin-bottom:16px;">Cálculo direto pelo custo: <b>CMV Sistema − CMV Real</b> de cada obra em andamento, por vertente. Não depende do faturamento — só do que já foi lançado no estoque.</div>

  <section>
    <div class="section-head"><h2>Por obra</h2></div>
    <div class="table-wrap table-scroll"><table>
      <thead><tr>
        <th>Obra / Pedido</th>
        <th class="num">Falta Alumínio</th><th class="num">Falta Vidro</th><th class="num">Falta Acessório</th><th class="num">Falta total</th>
        <th class="num">% Produção faturada</th><th class="num">% Custo consumido</th><th>Cruzamento</th>
      </tr></thead>
      <tbody>
        ${linhas.length===0 ? `<tr><td colspan="8"><div class="empty">Nenhuma obra "Em andamento" no comparativo.</div></td></tr>` : linhas.map(l=>`
        <tr data-pedido="${l.ped.id}" style="cursor:pointer;">
          <td><b>${esc(l.ped.ped)}</b></td>
          <td class="num">${fmtMoney(l.falta.aluminio)}</td>
          <td class="num">${fmtMoney(l.falta.vidro)}</td>
          <td class="num">${fmtMoney(l.falta.acessorio)}</td>
          <td class="num"><b>${fmtMoney(l.totalFalta)}</b></td>
          <td class="num">${l.percProd===null?'—':fmtNum(l.percProd)+'%'}</td>
          <td class="num">${l.percCusto===null?'—':fmtNum(l.percCusto)+'%'}</td>
          <td>${l.alerta===null ? (l.percProd===null?'<span class="badge neutral">sem etapa cadastrada</span>':'<span class="badge ok">ok</span>') : `<span class="badge warn" style="background:#f3dede;color:#a13c3c;">${l.alerta>0?'faturou mais que gastou':'gastou mais que faturou'} (${Math.abs(l.alerta).toFixed(0)}pp)</span>`}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>
  </section>
  `;
}

function similaridadeNomes(a, b){
  const wa = new Set(normalizeNome(a));
  const wb = normalizeNome(b);
  if(wa.size===0 || wb.length===0) return 0;
  const inter = wb.filter(w=>wa.has(w)).length;
  return inter; // quantidade de palavras em comum
}

function renderVinculos(){
  const semVinculo = state.obras.filter(o=> !pedidoDaObra(o.id));
  const comMovimento = semVinculo.filter(o=> custoObra(o.id)>0);
  const semMovimento = semVinculo.filter(o=> custoObra(o.id)<=0);
  let ordenadas = [...comMovimento, ...semMovimento];

  const buscaLista = state.vinculosListaBusca.trim().toLowerCase();
  if(buscaLista){
    ordenadas = ordenadas.filter(o=>
      o.n.toLowerCase().includes(buscaLista) ||
      (o.pedido||'').toLowerCase().includes(buscaLista)
    );
  }

  const pedidosDisponiveis = state.pedidos.filter(p=>!p.obraId);
  const busca = state.vinculoBusca.trim().toLowerCase();
  const obraAtual = state.obraParaVincular ? obraById(state.obraParaVincular) : null;

  // pré-calcula a melhor sugestão de cada obra sem vínculo, pra já mostrar direto na linha
  const melhorSugestao = {};
  ordenadas.forEach(o=>{
    let melhor = null, melhorScore = 0;
    pedidosDisponiveis.forEach(p=>{
      const score = similaridadeNomes(o.n, p.ped);
      if(score>melhorScore){ melhorScore = score; melhor = p; }
    });
    if(melhor) melhorSugestao[o.id] = melhor;
  });

  let sugestoes = [];
  if(obraAtual){
    if(busca.length>0){
      sugestoes = pedidosDisponiveis.filter(p=> p.ped.toLowerCase().includes(busca)).slice(0,10);
    } else if(state.vinculoVerTodos){
      sugestoes = [...pedidosDisponiveis].sort((a,b)=>a.ped.localeCompare(b.ped));
    } else {
      sugestoes = [...pedidosDisponiveis]
        .map(p=>({p, score: similaridadeNomes(obraAtual.n, p.ped)}))
        .filter(x=>x.score>0)
        .sort((a,b)=>b.score-a.score)
        .slice(0,8)
        .map(x=>x.p);
    }
  }

  return `
  <div class="hint" style="margin-bottom:16px;">${semVinculo.length} obra(s) do estoque ainda não têm um pedido vinculado no Comparativo/Faturamento. As com movimentação de material aparecem primeiro — são as mais importantes de vincular. Quando o sistema acha um pedido parecido, já aparece pronto pra confirmar num clique.</div>

  <div class="toolbar">
    <input type="text" class="search-input" id="vinculos-lista-busca" placeholder="Buscar por nome da obra ou nº do pedido…" value="${esc(state.vinculosListaBusca)}">
    <div style="margin-left:auto;color:var(--ink-soft);font-size:12px;">${ordenadas.length} de ${semVinculo.length}</div>
  </div>

  <div class="table-wrap table-scroll"><table>
    <thead><tr><th>Obra (estoque)</th><th class="num">Custo já lançado</th><th>Sugestão de pedido</th><th>Vínculo</th></tr></thead>
    <tbody>
      ${ordenadas.length===0 ? `<tr><td colspan="4"><div class="empty">${buscaLista ? 'Nenhuma obra encontrada para essa busca.' : 'Todas as obras já estão vinculadas. 🎉'}</div></td></tr>` : ordenadas.map(o=>{
        const sug = melhorSugestao[o.id];
        return `
      <tr>
        <td><b>${esc(o.n)}</b>${o.pedido?` <span style="color:var(--ink-soft);font-size:11.5px;">· nº ${esc(o.pedido)}</span>`:''}</td>
        <td class="num">${fmtMoney(custoObra(o.id))}</td>
        <td>
          ${state.obraParaVincular!==o.id && sug ? `
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="font-size:12.5px;">${esc(sug.ped)}</span>
              ${souAdmin() ? `<button class="secondary small" data-confirmar-direto="${o.id}:${sug.id}">Confirmar</button>` : ''}
            </div>
          ` : (state.obraParaVincular!==o.id ? '<span style="color:var(--ink-soft);font-size:12px;">sem sugestão parecida</span>' : '')}
        </td>
        <td>
          ${state.obraParaVincular===o.id ? `
            <div class="autocomplete" style="position:relative;max-width:380px;">
              <input type="text" id="vinculo-busca" placeholder="Buscar pedido pelo nome…" value="${esc(state.vinculoBusca)}" autocomplete="off">
              ${!busca && !state.vinculoVerTodos ? `<div class="hint" style="margin:4px 0;">Sugestões parecidas com "${esc(o.n)}":</div>` : ''}
              ${sugestoes.length ? `<div class="ac-list" style="position:static;max-height:260px;">${sugestoes.map(p=>`<div class="ac-item" data-confirmar-vinculo="${p.id}"><div>${esc(p.ped)}</div><div class="meta">${p.status}</div></div>`).join('')}</div>` : `<div class="empty" style="padding:10px;">Nenhuma sugestão parecida — digite pra buscar ou veja a lista completa.</div>`}
              <div style="display:flex;gap:8px;margin-top:8px;">
                ${!state.vinculoVerTodos ? `<button class="secondary small" data-ver-todos-vinculo="1">Ver todos os pedidos disponíveis</button>` : ''}
                <button class="secondary small" data-cancelar-vinculo="1">Cancelar</button>
              </div>
            </div>
          ` : (souAdmin() ? `<button class="secondary small" data-iniciar-vinculo="${o.id}">Vincular a um pedido</button>` : '<span class="badge neutral">—</span>')}
        </td>
      </tr>`;
      }).join('')}
    </tbody>
  </table></div>
  `;
}

  const cmvReal = cmvRealCalc(p);

  const sistemaSobra = (p.abkg!==null && p.abkg!==undefined && p.alkg!==null && p.alkg!==undefined) ? round3(p.abkg - p.alkg) : null;

  const vertenteMap = {'Alumínio':'aluminio','Vidro':'vidro','Acessório':'acessorio'};

          return `

  `;
}

/* ---- HISTÓRICO ---- */
function renderHistorico(){
  const f = state.histFiltro;
  let list = [...state.movimentacoes];
  if(f.tipo!=='todos') list = list.filter(m=>m.tipo===f.tipo);
  if(f.obraId) list = list.filter(m=>String(m.obraId)===String(f.obraId));
  if(f.busca.trim()){
    const q = f.busca.trim().toLowerCase();
    list = list.filter(m=>{
      const p = produtoById(m.produtoId);
      return (p&&p.n.toLowerCase().includes(q)) || (m.responsavel||'').toLowerCase().includes(q);
    });
  }
  list.sort((a,b)=> new Date(b.data)-new Date(a.data));

  return `
  <div class="toolbar">
    <input type="text" class="search-input" id="hist-search" placeholder="Buscar produto ou responsável…" value="${esc(f.busca)}">
    <select id="hist-tipo">
      <option value="todos" ${f.tipo==='todos'?'selected':''}>Todos os tipos</option>
      <option value="Entrada" ${f.tipo==='Entrada'?'selected':''}>Entradas</option>
      <option value="Saída" ${f.tipo==='Saída'?'selected':''}>Saídas</option>
      <option value="Devolução" ${f.tipo==='Devolução'?'selected':''}>Devoluções</option>
    </select>
    <select id="hist-obra">
      <option value="">Todas as obras</option>
      ${state.obras.map(o=>`<option value="${o.id}" ${String(f.obraId)===String(o.id)?'selected':''}>${esc(o.n)}</option>`).join('')}
    </select>
    <div style="margin-left:auto;color:var(--ink-soft);font-size:12px;">${list.length} registro(s)</div>
  </div>
  <div class="table-wrap table-scroll">
  <table>
    <thead><tr><th>Data</th><th>Tipo</th><th>Produto</th><th class="num">Qtd.</th><th>Obra / Fornecedor</th><th>Responsável</th><th></th></tr></thead>
    <tbody>
      ${list.length===0 ? `<tr><td colspan="7"><div class="empty">Nenhuma movimentação encontrada.</div></td></tr>` : list.map(m=>renderMovRow(m,true)).join('')}
    </tbody>
  </table>
  </div>
  `;
}

/* ---- FORNECEDORES ---- */
function podeGerenciarFornecedor(){ return souAdmin() || souFabrica(); }

function renderFornecedores(){
  const list = [...state.fornecedores].sort((a,b)=>a.n.localeCompare(b.n));
  return `
  <div class="toolbar">
    <div style="margin-left:auto;">${podeGerenciarFornecedor() ? '<button data-open-modal="fornecedor">+ Novo fornecedor</button>' : ''}</div>

  <div class="table-wrap table-scroll">

    <tbody>
      ${list.length===0 ? `<tr><td colspan="8"><div class="empty">Nenhum fornecedor cadastrado.</div></td></tr>` : list.map(fo=>`

/* ---- MODAL ---- */
function renderModal(){
  const m = state.modal;
  if(m.type==='produto') return renderProdutoModal(m.editing, m.prefillNome);
  if(m.type==='obra') return renderObraModal();
  if(m.type==='fornecedor') return renderFornecedorModal(m.editing);
  return '';
}

/* ================= EVENTS ================= */
function attachEvents(){
  const logoutBtn = document.getElementById('logout-btn');
  if(logoutBtn) logoutBtn.addEventListener('click', fazerLogout);

  const reimportarBtn = document.getElementById('reimportar-btn');
  if(reimportarBtn) reimportarBtn.addEventListener('click', ()=>{
    if(confirm('Reimportar a base inicial? Isso completa/atualiza os dados que faltarem (não duplica o que já existe).')){
      state.precisaImportar = true;
      render();
    }
  });
  const excluirObraBtn = document.getElementById('excluir-obra-btn');
  if(excluirObraBtn) excluirObraBtn.addEventListener('click', excluirObra);
  const excluirPedidoBtn = document.getElementById('excluir-pedido-btn');
  if(excluirPedidoBtn) excluirPedidoBtn.addEventListener('click', excluirPedido);

  // seleção em lote — obras
  const toggleSelObras = document.getElementById('toggle-selecao-obras');
  if(toggleSelObras) toggleSelObras.addEventListener('click', ()=>{
    state.modoSelecaoObras = !state.modoSelecaoObras;
    state.obrasSelecionadas = new Set();
    render();
  });
  $root.querySelectorAll('[data-toggle-obra]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = Number(el.getAttribute('data-toggle-obra'));
      if(state.obrasSelecionadas.has(id)) state.obrasSelecionadas.delete(id); else state.obrasSelecionadas.add(id);
      render();
    });
  });
  const excluirSelObras = document.getElementById('excluir-selecionadas-obras');
  if(excluirSelObras) excluirSelObras.addEventListener('click', excluirObrasSelecionadas);

  // seleção em lote — pedidos
  const toggleSelPedidos = document.getElementById('toggle-selecao-pedidos');
  if(toggleSelPedidos) toggleSelPedidos.addEventListener('click', ()=>{
    state.modoSelecaoPedidos = !state.modoSelecaoPedidos;
    state.pedidosSelecionados = new Set();
    render();
  });
  $root.querySelectorAll('[data-toggle-pedido]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = Number(el.getAttribute('data-toggle-pedido'));
      if(state.pedidosSelecionados.has(id)) state.pedidosSelecionados.delete(id); else state.pedidosSelecionados.add(id);
      render();
    });
  });
  const excluirSelPedidos = document.getElementById('excluir-selecionados-pedidos');
  if(excluirSelPedidos) excluirSelPedidos.addEventListener('click', excluirPedidosSelecionados);

  $root.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.view = el.getAttribute('data-nav');
      state.obraSelecionada = null;
      state.pedidoSelecionado = null;
      render();
    });
  });

  $root.querySelectorAll('[data-obra]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.obraSelecionada = Number(el.getAttribute('data-obra'));
      state.view = 'obras';
      render();
    });
  });

  // listas de corte
  const lcAdd = document.getElementById('lc-add');
  if(lcAdd){
    lcAdd.addEventListener('click', ()=>{
      const numero = document.getElementById('lc-numero').value.trim();
      const obs = document.getElementById('lc-obs').value.trim();
      if(!numero){ showToast('Informe o número da lista de corte.', 'error'); return; }
      const o = obraById(state.obraSelecionada);
      if(!o.listasCorte) o.listasCorte = [];
      const nextLcId = o.listasCorte.length ? Math.max(...o.listasCorte.map(l=>l.id))+1 : 1;
      o.listasCorte.push({ id: nextLcId, numero, obs });
      persist(['obras'], {obras:o});
      showToast('Lista de corte adicionada.');
      render();
    });
  }
  $root.querySelectorAll('[data-del-lista]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = Number(el.getAttribute('data-del-lista'));
      const o = obraById(state.obraSelecionada);
      o.listasCorte = (o.listasCorte||[]).filter(l=>l.id!==id);
      persist(['obras'], {obras:o});
      render();
    });
  });

  // faturamento
  const saveValorVenda = document.getElementById('of-save-valorvenda');
  if(saveValorVenda){
    saveValorVenda.addEventListener('click', ()=>{
      const ped = pedidoAtivoFaturamento();
      if(!ped) return;
      ped.valorVenda = numOrNull('of-valorvenda-edit');
      persist(['pedidos'], {pedidos:ped});
      showToast('Valor de venda atualizado.');
      render();
    });
  }
  const etapaAdd = document.getElementById('etapa-add');
  if(etapaAdd){
    etapaAdd.addEventListener('click', ()=>{
      const ped = pedidoAtivoFaturamento();
      if(!ped) return;
      if(!ped.etapasFaturamento) ped.etapasFaturamento = [];
      ped.etapasFaturamento.push({ id: nextEtapaId(ped), nome:'', tipo:'producao', percentual:0, data:'', faturado:false });
      persist(['pedidos'], {pedidos:ped});
      render();
    });
  }
  $root.querySelectorAll('[data-etapa-nome]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const ped = pedidoAtivoFaturamento();
      if(!ped) return;
      const e = etapasFat(ped).find(x=>x.id===Number(el.getAttribute('data-etapa-nome')));
      e.nome = el.value.trim();
      persist(['pedidos'], {pedidos:ped});
    });
  });
  $root.querySelectorAll('[data-etapa-tipo]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const ped = pedidoAtivoFaturamento();
      if(!ped) return;
      const e = etapasFat(ped).find(x=>x.id===Number(el.getAttribute('data-etapa-tipo')));
      e.tipo = el.value;
      persist(['pedidos'], {pedidos:ped});
      render();
    });
  });
  $root.querySelectorAll('[data-etapa-perc]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const ped = pedidoAtivoFaturamento();
      if(!ped) return;
      const e = etapasFat(ped).find(x=>x.id===Number(el.getAttribute('data-etapa-perc')));
      e.percentual = el.value==='' ? 0 : parseFloat(el.value);
      persist(['pedidos'], {pedidos:ped});
      render();
    });
  });
  $root.querySelectorAll('[data-etapa-data]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const ped = pedidoAtivoFaturamento();
      if(!ped) return;
      const e = etapasFat(ped).find(x=>x.id===Number(el.getAttribute('data-etapa-data')));
      e.data = el.value;
      persist(['pedidos'], {pedidos:ped});
      render();
    });
  });
  $root.querySelectorAll('[data-etapa-faturado]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const ped = pedidoAtivoFaturamento();
      if(!ped) return;
      const e = etapasFat(ped).find(x=>x.id===Number(el.getAttribute('data-etapa-faturado')));
      e.faturado = el.checked;
      persist(['pedidos'], {pedidos:ped});
      render();
    });
  });
  $root.querySelectorAll('[data-del-etapa]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const ped = pedidoAtivoFaturamento();
      if(!ped) return;
      const id = Number(el.getAttribute('data-del-etapa'));
      ped.etapasFaturamento = etapasFat(ped).filter(e=>e.id!==id);
      persist(['pedidos'], {pedidos:ped});
      render();
    });
  });

  // comparativo
  $root.querySelectorAll('[data-compfilt]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.compFiltro = el.getAttribute('data-compfilt'); render(); });
  });
  const compSearch = document.getElementById('comp-search');
  if(compSearch){
    compSearch.addEventListener('input', e=>{ state.compSearch = e.target.value; render(); preserveFocus('comp-search'); });
  }
  $root.querySelectorAll('[data-pedido]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.pedidoSelecionado = Number(el.getAttribute('data-pedido'));
      state.view = 'comparativo';
      render();
    });
  });
  const pedObraLink = document.getElementById('ped-obra-link');
  if(pedObraLink){
    pedObraLink.addEventListener('change', e=>{
      const ped = state.pedidos.find(x=>x.id===state.pedidoSelecionado);
      ped.obraId = e.target.value ? Number(e.target.value) : null;
      ped.autoVinculo = false;
      let obraTocada;
      if(ped.obraId){
        const obra = obraById(ped.obraId);
        if(obra && !obra.pedido){
          const numeros = ped.ped.match(/\d{1,4}-\d{4}/g);
          if(numeros && numeros.length){ obra.pedido = numeros[numeros.length-1]; obraTocada = obra; }
        }
      }
      persist(obraTocada ? ['pedidos','obras'] : ['pedidos'], {pedidos:ped, obras:obraTocada});
      showToast('Vínculo atualizado.');
      render();
    });
  }
  const pedSave = document.getElementById('ped-save');
  if(pedSave) pedSave.addEventListener('click', salvarPedido);

  // vínculos pendentes
  $root.querySelectorAll('[data-iniciar-vinculo]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.obraParaVincular = Number(el.getAttribute('data-iniciar-vinculo'));
      state.vinculoBusca = '';
      state.vinculoVerTodos = false;
      render();
    });
  });
  const vinculoBuscaEl = document.getElementById('vinculo-busca');
  if(vinculoBuscaEl){
    vinculoBuscaEl.addEventListener('input', e=>{ state.vinculoBusca = e.target.value; render(); preserveFocus('vinculo-busca'); });
  }
  $root.querySelectorAll('[data-ver-todos-vinculo]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.vinculoVerTodos = true; render(); });
  });
  $root.querySelectorAll('[data-confirmar-direto]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [obraIdStr, pedIdStr] = el.getAttribute('data-confirmar-direto').split(':');
      const obraId = Number(obraIdStr), pedId = Number(pedIdStr);
      const ped = state.pedidos.find(p=>p.id===pedId);
      if(!ped) return;
      ped.obraId = obraId;
      ped.autoVinculo = false;
      const obra = obraById(obraId);
      let obraTocada;
      if(obra && !obra.pedido){
        const numeros = ped.ped.match(/\d{1,4}-\d{4}/g);
        if(numeros && numeros.length){ obra.pedido = numeros[numeros.length-1]; obraTocada = obra; }
      }
      persist(obraTocada ? ['pedidos','obras'] : ['pedidos'], {pedidos:ped, obras:obraTocada});
      showToast('Vínculo confirmado.');
      render();
    });
  });
  $root.querySelectorAll('[data-confirmar-vinculo]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const pedId = Number(el.getAttribute('data-confirmar-vinculo'));
      const ped = state.pedidos.find(p=>p.id===pedId);
      ped.obraId = state.obraParaVincular;
      ped.autoVinculo = false;
      const obra = obraById(state.obraParaVincular);
      if(obra && !obra.pedido){
        const numeros = ped.ped.match(/\d{1,4}-\d{4}/g);
        if(numeros && numeros.length) obra.pedido = numeros[numeros.length-1];
      }
      persist(['pedidos','obras'], {pedidos:ped, obras:obra});
      showToast('Vínculo confirmado.');
      state.obraParaVincular = null;
      state.vinculoBusca = '';
      state.vinculoVerTodos = false;
      render();
    });
  });
  $root.querySelectorAll('[data-cancelar-vinculo]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.obraParaVincular = null;
      state.vinculoBusca = '';
      state.vinculoVerTodos = false;
      render();
    });
  });
  const pedSaveSucata = document.getElementById('ped-save-sucata');
  if(pedSaveSucata) pedSaveSucata.addEventListener('click', ()=>{
    const ped = state.pedidos.find(x=>x.id===state.pedidoSelecionado);
    ped.precoSucata = numOrNull('ped-precosucata');
    persist(['pedidos'], {pedidos:ped});
    showToast('Preço da sucata salvo.');
    render();
  });

  // estoque
  const estSearch = document.getElementById('estoque-search');
  if(estSearch){
    estSearch.addEventListener('input', e=>{ state.estoqueSearch = e.target.value; render(); preserveFocus('estoque-search'); });
  }
  // obras

function preserveFocus(id){
  const el = document.getElementById(id);
  if(el){ el.focus(); const v=el.value; el.value=''; el.value=v; }
}

function nextItemLoteId(){
  const itens = state.movLote.itens;
  return itens.length ? Math.max(...itens.map(i=>i.id))+1 : 1;
}
function adicionarItemLote(){
  const p = state.movLoteProdutoSel;
  if(!p){ showToast('Selecione um produto.', 'error'); return; }
  const qtd = parseFloat(state.movLoteQtd);
  if(!qtd || qtd<=0){ showToast('Informe uma quantidade válida.', 'error'); return; }
  const precoManualTxt = state.movLoteItemPreco.trim();
  const precoManual = precoManualTxt ? parseFloat(precoManualTxt) : null;
  state.movLote.itens.push({
    id: nextItemLoteId(),
    produtoId: p.id,
    nome: p.n,
    unidade: p.u,
    qtd: qtd,
    vertente: state.movLoteVertente,
    precoManual: precoManual
  });
  state.movLoteProdutoSel = null;
  state.movLoteBusca = '';
  state.movLoteQtd = '';
  state.movLoteItemPreco = '';
  render();
  const buscaEl = document.getElementById('lote-produto-busca');
  if(buscaEl) buscaEl.focus();
}

async function registrarLoteMovimentacoes(){
  const f = state.movLote;
  if(f.itens.length===0){ showToast('Adicione pelo menos um item.', 'error'); return; }
  if((f.tipo==='Saída'||f.tipo==='Devolução') && !f.obraId){ showToast('Selecione a obra (centro de custo).', 'error'); return; }

  const novasMovs = [];
  const produtosAfetados = new Map();
  const dataIso = f.data ? new Date(f.data+'T'+new Date().toTimeString().slice(0,8)).toISOString() : new Date().toISOString();

  const pularEstoque = f.tipo==='Saída' && f.naoAfetaEstoque;

  f.itens.forEach(item=>{
    const produto = produtoById(item.produtoId);
    if(!produto) return;
    if(!pularEstoque){
      const delta = (f.tipo==='Entrada'||f.tipo==='Devolução') ? item.qtd : -item.qtd;
      produto.q = round3(produto.q + delta);
      produtosAfetados.set(produto.id, produto);
    }

    const mov = {
      id: nextId(state.movimentacoes.concat(novasMovs)),
      tipo: f.tipo,
      produtoId: item.produtoId,
      qtd: item.qtd,
      obraId: (f.tipo==='Saída'||f.tipo==='Devolução') ? Number(f.obraId) : null,
      fornecedorId: f.tipo==='Entrada' && f.fornecedorId ? Number(f.fornecedorId) : null,
      responsavel: f.responsavel || '',
      motivo: '',
      data: dataIso,
      preco: (item.precoManual!=null ? item.precoManual : produto.p) ?? null,
      vertente: (f.tipo==='Saída'||f.tipo==='Devolução') ? item.vertente : null,
      cancelado: false,
      naoAfetaEstoque: pularEstoque
    };
    state.movimentacoes.push(mov);
    novasMovs.push(mov);
  });

  state.saving = true; updateSaveIndicator();
  try{
    const { error: errMov } = await sbClient.from('movimentacoes').upsert(novasMovs.map(movToRow));
    if(errMov) throw errMov;
    const { error: errProd } = await sbClient.from('produtos').upsert([...produtosAfetados.values()].map(produtoToRow));
    if(errProd) throw errProd;
    showToast(`${novasMovs.length} movimentação${novasMovs.length>1?'ões':''} registrada${novasMovs.length>1?'s':''}.`);
  }catch(e){
    console.error(e);
    showToast('Erro ao salvar: '+e.message, 'error');
  }
  state.saving = false; updateSaveIndicator();

  state.movLote.itens = [];
  render();
}

function round3(v){ return Math.round(v*1000)/1000; }

function cancelarMovimentacao(id){
  const mov = state.movimentacoes.find(m=>m.id===id);
  if(!mov || mov.cancelado) return;
  if(!confirm('Cancelar esta movimentação? O saldo do produto será revertido.')) return;
  const produto = produtoById(mov.produtoId);
  if(produto){
    const delta = (mov.tipo==='Entrada'||mov.tipo==='Devolução') ? -mov.qtd : mov.qtd;
    produto.q = round3(produto.q + delta);
  }
  mov.cancelado = true;
  marcarMovDirty(mov);
  persist(['produtos','movimentacoes'], {produtos:produto});
  showToast('Movimentação cancelada.');
  render();
}

function salvarProduto(){
  const nome = document.getElementById('pf-nome').value.trim();
  if(!nome){ showToast('Informe o nome do produto.', 'error'); return; }
  const cat = document.getElementById('pf-cat').value.trim();
  const subcat = document.getElementById('pf-subcat').value.trim();
  const forn = document.getElementById('pf-forn').value.trim();
  const unidade = document.getElementById('pf-unidade').value;
  const vertente = document.getElementById('pf-vertente').value;
  const precoRaw = document.getElementById('pf-preco').value;
  const minRaw = document.getElementById('pf-min').value;
  const saldoRaw = document.getElementById('pf-saldo').value;
  const preco = precoRaw==='' ? null : parseFloat(precoRaw);
  const minimo = minRaw==='' ? 0 : parseFloat(minRaw);
  const saldo = saldoRaw==='' ? 0 : parseFloat(saldoRaw);

  const editing = state.modal.editing;
  const contextoLote = state.modal.contextoLote;
  let salvo;
  if(editing){
    editing.n = nome; editing.c = cat; editing.s = subcat; editing.f = forn;
    editing.p = preco; editing.m = minimo; editing.q = saldo; editing.u = unidade; editing.v = vertente;
    salvo = editing;
  } else {
    salvo = { id: nextId(state.produtos), n: nome, c: cat, s: subcat, f: forn, p: preco, q: saldo, m: minimo, u: unidade, v: vertente };
    state.produtos.push(salvo);
  }
  persist(['produtos'], {produtos:salvo});
  state.modal = null;
  showToast(editing ? 'Item atualizado.' : 'Item adicionado ao estoque.');
  if(!editing && contextoLote){
    state.movLoteProdutoSel = salvo;
    state.movLoteBusca = salvo.n;
    state.movLoteVertente = salvo.v || 'acessorio';
  }
  render();
  if(!editing && contextoLote){
    const qtdEl = document.getElementById('lote-item-qtd');
    if(qtdEl) qtdEl.focus();
  }
}

async function excluirPedido(){
  const p = state.pedidos.find(x=>x.id===state.pedidoSelecionado);
  if(!p) return;
  if(p.obraId){ showToast('Esse pedido está vinculado a uma obra — desvincule antes de excluir.', 'error'); return; }
  if(!confirm(`Excluir o pedido "${p.ped}"? Isso não pode ser desfeito.`)) return;
  state.pedidos = state.pedidos.filter(x=>x.id!==p.id);
  await excluirUm('pedidos', p.id);
  state.pedidoSelecionado = null;
  showToast('Pedido excluído.');
  render();
}

async function excluirObrasSelecionadas(){
  const ids = [...state.obrasSelecionadas];
  if(ids.length===0) return;
  if(!confirm(`Excluir ${ids.length} obra(s) selecionada(s)? Isso não pode ser desfeito.`)) return;
  state.saving = true; updateSaveIndicator();
  for(const id of ids){
    const pedLigado = pedidoDaObra(id);
    if(pedLigado){
      pedLigado.obraId = null;
      await salvarUm('pedidos', pedLigado);
    }
    await excluirUm('obras', id);
  }
  state.obras = state.obras.filter(o=>!state.obrasSelecionadas.has(o.id));
  state.obrasSelecionadas = new Set();
  state.modoSelecaoObras = false;
  state.saving = false; updateSaveIndicator();
  showToast(`${ids.length} obra(s) excluída(s).`);
  render();
}

async function excluirPedidosSelecionados(){
  const ids = [...state.pedidosSelecionados];
  if(ids.length===0) return;
  if(!confirm(`Excluir ${ids.length} pedido(s) selecionado(s)? Isso não pode ser desfeito.`)) return;

  for(const id of ids){

  state.saving = false; updateSaveIndicator();

}

async function excluirObra(){
  const o = obraById(state.obraSelecionada);
  if(!o) return;
  const movsAtivas = itensObra(o.id);

  if(movsAtivas.length>0){
    const ok = confirm(
      `Essa obra tem ${movsAtivas.length} movimentação(ões) de material lançada(s).\n\n` +
      `Excluir mesmo assim? As movimentações NÃO serão apagadas (o histórico de estoque continua intacto), ` +
      `mas ficarão sem nenhuma obra vinculada — você pode religar elas em outra obra depois, se precisar.\n\n` +
      `Isso não pode ser desfeito.`
    );
    if(!ok) return;
  } else {
    if(!confirm(`Excluir a obra "${o.n}"? Isso não pode ser desfeito.`)) return;
  }

  state.saving = true; updateSaveIndicator();

  if(movsAtivas.length>0){
    for(const mov of movsAtivas){
      mov.obraId = null;
      marcarMovDirty(mov);
    }
    await persist(['movimentacoes'], {});
  }

  const pedLigado = pedidoDaObra(o.id);
  if(pedLigado){
    pedLigado.obraId = null;
    await salvarUm('pedidos', pedLigado);
  }
  state.obras = state.obras.filter(x=>x.id!==o.id);
  await excluirUm('obras', o.id);
  state.obraSelecionada = null;
  state.saving = false; updateSaveIndicator();
  showToast('Obra excluída.' + (movsAtivas.length>0 ? ` ${movsAtivas.length} movimentação(ões) ficaram sem obra vinculada.` : ''));
  render();
}

function salvarObra(){
  const nome = document.getElementById('of-nome').value.trim();
  const pedido = document.getElementById('of-pedido').value.trim();
  if(!nome){ showToast('Informe o nome da obra.', 'error'); return; }
  if(!pedido){ showToast('Informe o número do pedido — é obrigatório para manter o vínculo com o comparativo.', 'error'); return; }

  const pbkg = numOrNull('of-pbkg');
  const plkg = numOrNull('of-plkg');
  const vidm2 = numOrNull('of-vidm2');
  const cvsis = numOrNull('of-cvsis');
  const casis = numOrNull('of-casis');
  const caesis = numOrNull('of-caesis');
  const cmvsis = (casis||0) + (cvsis||0) + (caesis||0);
  const valorVenda = numOrNull('of-valorvenda');

  const nova = { id: nextId(state.obras), n: nome, st: 'Ativa', pedido: pedido, listasCorte: [] };
  state.obras.push(nova);

  // se já existir um pedido importado (sem obra vinculada) com esse número, usa ele —
  // evita duplicar e perder os dados de custo sistema que já vieram da planilha.
  const pedidoExistente = state.pedidos.find(p => !p.obraId && p.ped.toUpperCase().includes(pedido.toUpperCase()));
  let pedidoTocado;
  if(pedidoExistente){
    pedidoExistente.obraId = nova.id;
    pedidoExistente.autoVinculo = false;
    if(pedidoExistente.valorVenda===undefined || pedidoExistente.valorVenda===null) pedidoExistente.valorVenda = valorVenda;
    if(pedidoExistente.abkg===undefined || pedidoExistente.abkg===null) pedidoExistente.abkg = pbkg;
    if(pedidoExistente.alkg===undefined || pedidoExistente.alkg===null) pedidoExistente.alkg = plkg;
    if(pedidoExistente.vidm2===undefined || pedidoExistente.vidm2===null) pedidoExistente.vidm2 = vidm2;
    pedidoTocado = pedidoExistente;
  } else {
    pedidoTocado = {
      id: nextId(state.pedidos),
      ped: `${nome} — Pedido ${pedido}`,
      status: 'Em andamento',
      casis, cvsis, caesis, cmvsis,
      careal: null, cvreal: null, caereal: null, cmvreal: null,
      abkg: pbkg, alkg: plkg, vidm2,
      pbruto: null, pliq: null, sucata: null,
      obraId: nova.id, autoVinculo: false,
      valorVenda: valorVenda, etapasFaturamento: []
    };
    state.pedidos.push(pedidoTocado);
  }

  persist(['obras','pedidos'], {obras:nova, pedidos:pedidoTocado});
  state.modal = null;
  if(state.view==='movimentacao'){ state.movLote.obraId = nova.id; }
  showToast(pedidoExistente ? 'Obra cadastrada e vinculada a um pedido já existente.' : 'Obra cadastrada e vinculada ao comparativo.');
  render();
}

function mostrarErroFatal(msg){
  const el = document.getElementById('root');
  if(!el) return;
  el.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:center;width:100%;height:100vh;background:#f6f4ef;font-family:sans-serif;padding:20px;">
      <div style="background:#fff;border:1px solid #e4e2dc;border-radius:4px;padding:28px;max-width:560px;">
        <h2 style="margin:0 0 12px 0;color:#a13c3c;">Ocorreu um erro</h2>
        <p style="font-size:13px;color:#333;line-height:1.5;white-space:pre-wrap;">${(msg||'').toString().slice(0,600)}</p>
        <p style="font-size:12px;color:#888;margin-top:16px;">Tire um print desta tela e mande pro suporte.</p>
      </div>
    </div>`;
}
window.addEventListener('error', e=>{ mostrarErroFatal(e.message + (e.filename?(' — '+e.filename+':'+e.lineno):'')); });
window.addEventListener('unhandledrejection', e=>{ mostrarErroFatal('Erro assíncrono: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)); });

initAuth().catch(e=>{ console.error(e); mostrarErroFatal(e.message); });


</script>
